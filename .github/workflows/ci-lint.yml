name: CI Lint & Type Check

# Fast checks only — runs on every push and PR.
# The full APK build is in build-apk.yml.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Python + Kotlin Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Python syntax check
        working-directory: scripts
        run: |
          python3 -m py_compile import_local_model.py gen_key.py encrypt_model.py build_tokenizer_meta.py download_voice_models.py download_lfm2.py
