name: Build OptoBot APK

# Builds a release APK for OptoBot on every push to main and on manual dispatch.
# Secrets required (configure under Settings → Secrets and variables → Actions):
#   - HF_TOKEN  (optional — only if the LFM2 HuggingFace repo is gated for your account)
#   - SIGN_KEYSTORE_BASE64     (optional — base64 of your release .jks for signing)
#   - SIGN_KEY_ALIAS           (optional)
#   - SIGN_STORE_PASSWORD      (optional)
#   - SIGN_KEY_PASSWORD        (optional)
#
# If signing secrets are absent, the workflow produces an unsigned release APK
# (still runnable on devices via `adb install` with `--bypass-low-target-sdk-block`).
#
# Threat model note:
#   - We NEVER hardcode any model name, vendor string, or the per-build secret in
#     this file. The build secret is generated fresh on every run via
#     scripts/gen_key.py and lives only inside the runner's build sandbox.
#   - OptoBuildSecret.kt is generated at workflow run-time, used for the build,
#     and discarded. It is never committed to git.

on:
  push:
    branches: [main, master]
    paths:
      - 'optobot/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'optobot/**'
  workflow_dispatch:
    inputs:
      model_size:
        description: 'Which LFM size to bundle'
        type: choice
        options:
          - LFM2-1.2B-ONNX-INT4
          - LFM2-350M-ONNX-INT4
          - LFM2-3B-ONNX-INT4
        default: LFM2-1.2B-ONNX-INT4

# Only one APK build at a time per branch.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: optobot/package.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python build deps (cryptography for AES-256-GCM)
        run: |
          python -m pip install --upgrade pip
          pip install cryptography requests

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12075200'

      - name: Install npm dependencies
        working-directory: optobot
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate per-build OptoBuildSecret + salt
        working-directory: optobot
        run: |
          python3 scripts/gen_key.py --force
          # Sanity check: ensure the secret file exists and is gitignored
          test -f android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          grep -q "OptoBuildSecret" android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          echo "✓ OptoBuildSecret.kt generated locally (not committed)"

      - name: Download model + encrypt bundled assets
        working-directory: optobot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # If HF_TOKEN is set, export it for the download script.
          # If the LFM2 repo is public for anonymous access, HF_TOKEN is not required.
          bash scripts/build_assets.sh
          # Verify the encrypted bundles exist
          test -f android/app/src/main/assets/opto_core.bin
          test -f android/app/src/main/assets/opto_meta.bin
          test -f android/app/src/main/assets/opto_key.hint
          ls -lh android/app/src/main/assets/opto_*.bin android/app/src/main/assets/opto_key.hint

      - name: Configure Gradle
        working-directory: optobot/android
        run: |
          # Create local.properties pointing at the Android SDK installed above
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12075200" >> local.properties
          cat local.properties

      - name: Decode release keystore (if provided)
        if: ${{ secrets.SIGN_KEYSTORE_BASE64 != '' }}
        working-directory: optobot/android/app
        run: |
          echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "✓ release.keystore decoded"

      - name: Build release APK
        working-directory: optobot/android
        env:
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGN_KEY_ALIAS" ]; then
            # Inject signing config into app/build.gradle via env-driven override
            ./gradlew assembleRelease \
              -PtrackSigning=true \
              -PsignKeyAlias="$SIGN_KEY_ALIAS" \
              -PsignStorePassword="$SIGN_STORE_PASSWORD" \
              -PsignKeyPassword="$SIGN_KEY_PASSWORD"
          else
            echo "⚠ No signing secrets — building unsigned release APK"
            ./gradlew assembleRelease
          fi

      - name: Locate built APK
        id: apk
        working-directory: optobot
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Found APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          # Get a clean filename
          BASENAME=$(basename "$APK")
          cp "$APK" "OptoBot-${GITHUB_SHA::7}-${BASENAME}"

      - name: Compute APK checksum
        working-directory: optobot
        run: |
          sha256sum OptoBot-*.apk | tee OptoBot-checksums.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptoBot-APK-${{ github.sha }}
          path: |
            optobot/OptoBot-*.apk
            optobot/OptoBot-checksums.txt
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup sensitive files (defensive — runner is destroyed post-job)
        if: always()
        working-directory: optobot
        run: |
          rm -f android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          rm -f android/app/src/main/assets/opto_*.bin
          rm -f android/app/src/main/assets/opto_key.hint
          rm -f android/app/release.keystore
          echo "✓ cleaned sensitive intermediates"

  notify:
    name: Summary
    needs: build-apk
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "### OptoBot APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.build-apk.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the workflow run page (Artifacts section, retained 30 days)." >> $GITHUB_STEP_SUMMARY
