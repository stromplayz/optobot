name: Build OptoBot APK

# Builds a release APK for OptoBot on every push to main and on manual dispatch.
#
# What this workflow does NOT do:
#   - It does NOT download any model from HuggingFace, Ollama Hub, or any
#     other model hub. The user must drop their own model.onnx + tokenizer.json
#     into _model_raw/ (gitignored) BEFORE the workflow runs. We encrypt and
#     bundle whatever they provide.
#   - If _model_raw/ is empty, the workflow runs in 'stub mode': it generates
#     the OptoBuildSecret, builds a stub encrypted bundle, and verifies
#     the lint + Python + Kotlin + TypeScript all pass. The actual APK build
#     step is skipped because building a full RN APK requires the RN gradle
#     plugin (which ships with the RN CLI generator, not the npm package
#     alone). Run `./gradlew assembleRelease` locally to build the APK.
#
# Secrets you can optionally configure:
#   - SIGN_KEYSTORE_BASE64     (optional — base64 of your release .jks for signing)
#   - SIGN_KEY_ALIAS           (optional)
#   - SIGN_STORE_PASSWORD      (optional)
#   - SIGN_KEY_PASSWORD        (optional)
#
# Threat model note:
#   - We NEVER hardcode any model name, vendor string, or the per-build secret
#     in this file. The build secret is generated fresh on every run via
#     scripts/gen_key.py and lives only inside the runner's build sandbox.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      stub_mode:
        description: 'Force a stub build (no model needed) for UI preview'
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build deps (cryptography for AES-256-GCM)
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Python syntax check
        working-directory: scripts
        run: |
          python3 -m py_compile import_local_model.py gen_key.py encrypt_model.py build_tokenizer_meta.py

      - name: Generate per-build OptoBuildSecret + salt
        run: |
          python3 scripts/gen_key.py --force
          test -f android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          grep -q "OptoBuildSecret" android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          echo "OptoBuildSecret.kt generated locally (not committed)"

      - name: Build & encrypt bundled model (or stub if no model is provided)
        env:
          FORCE_STUB: ${{ inputs.stub_mode }}
        run: |
          if [ "$FORCE_STUB" = "true" ]; then
            echo "Stub mode forced via workflow_dispatch input"
            rm -f _model_raw/model.onnx _model_raw/tokenizer.json
          fi
          bash scripts/build_assets.sh
          ls -lh android/app/src/main/assets/opto_*.bin android/app/src/main/assets/opto_key.hint

      - name: Upload encrypted bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptoBot-encrypted-bundle-${{ github.sha }}
          path: |
            android/app/src/main/assets/opto_core.bin
            android/app/src/main/assets/opto_meta.bin
            android/app/src/main/assets/opto_key.hint
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup sensitive files (defensive — runner is destroyed post-job)
        if: always()
        run: |
          rm -f android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          rm -f android/app/src/main/assets/opto_*.bin
          rm -f android/app/src/main/assets/opto_key.hint
          echo "cleaned sensitive intermediates"

  notify:
    name: Summary
    needs: build-apk
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "### OptoBot Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.build-apk.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "What ran:" >> $GITHUB_STEP_SUMMARY
          echo "- Lint (TypeScript + Python + Kotlin)" >> $GITHUB_STEP_SUMMARY
          echo "- OptoBuildSecret + salt generated" >> $GITHUB_STEP_SUMMARY
          echo "- Encrypted bundle (opto_core.bin + opto_meta.bin + opto_key.hint)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To build the actual APK locally:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cd android && ./gradlew assembleRelease" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The encrypted bundle artifact is downloadable from this run for 30 days." >> $GITHUB_STEP_SUMMARY
