name: Build OptoBot APK

# Builds a real, installable release APK for OptoBot on every push to main
# and on manual dispatch.
#
# The APK is signed with the debug keystore (so it's installable via
# `adb install` without a custom keystore). To publish to Play Store,
# add the SIGN_* secrets and wire them into app/build.gradle.
#
# Models bundled in the APK:
#   - LFM2.5-230M Q4 (~202MB) — auto-downloaded from HuggingFace via HF_TOKEN
#   - Whisper base.en Q5_1 (~75MB) — optional, skipped if HF_TOKEN missing
#   - Kokoro voice pack (~3MB) — optional
#
# The APK ships with all models pre-bundled. Users never have to download
# anything after install.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      stub_mode:
        description: 'Force a stub build (no model, UI preview only)'
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Generate per-build OptoBuildSecret + salt
        run: |
          python3 scripts/gen_key.py --force
          test -f android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          echo "OptoBuildSecret.kt generated"

      - name: Build & encrypt bundled model (HF download if no local model)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_STUB: ${{ inputs.stub_mode }}
        run: |
          if [ "$FORCE_STUB" = "true" ]; then
            echo "Stub mode forced — removing local model + disabling HF download"
            rm -f _model_raw/model.onnx _model_raw/tokenizer.json
            unset HF_TOKEN
          fi
          bash scripts/build_assets.sh
          ls -lh android/app/src/main/assets/opto_*.bin android/app/src/main/assets/opto_key.hint 2>/dev/null || true

      - name: Configure Gradle (local.properties)
        working-directory: android
        run: |
          SDK_DIR="$ANDROID_HOME"
          echo "sdk.dir=$SDK_DIR" > local.properties
          cat local.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build-output.log
          # Check if APK was produced
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK found"
            echo "--- last 50 lines of build log ---"
            tail -50 build-output.log
            exit 1
          fi

      - name: Locate built APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK found"
            ls -la android/app/build/outputs/apk/release/ 2>/dev/null || true
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" "OptoBot-${GITHUB_SHA::7}-release.apk"

      - name: Compute APK checksum
        run: |
          sha256sum OptoBot-*.apk | tee OptoBot-checksums.txt

      # NOTE: No actions/upload-artifact here — artifact storage counts against the
      # account's 500 MB Actions storage quota and 6 prior builds consumed ~5.6 GB.
      # The APK is delivered via the GitHub Release step below (release assets do
      # NOT count toward Actions storage). Keep artifacts for debugging only, and
      # if ever re-added, use retention-days: 1.

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          rm -f android/app/src/main/assets/opto_*.bin
          rm -f android/app/src/main/assets/opto_key.hint
          echo "cleaned sensitive intermediates"

      - name: Create GitHub Release and upload APK
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls OptoBot-*-release.apk | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found, skipping release"
            exit 0
          fi
          TAG="v0.4.${GITHUB_RUN_NUMBER}"
          echo "Creating release $TAG for $APK_FILE"
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"main\",\"name\":\"OptoBot $TAG\",\"body\":\"Full working APK with on-device LFM2.5-230M + Whisper STT + Kokoro TTS. All models pre-bundled and encrypted.\",\"draft\":false,\"prerelease\":false}" \
            > /tmp/release.json
          RELEASE_ID=$(python3 -c "import json; print(json.load(open('/tmp/release.json')).get('id',''))")
          if [ -z "$RELEASE_ID" ]; then
            echo "Failed to create release"
            cat /tmp/release.json
            exit 0
          fi
          echo "Release ID: $RELEASE_ID"
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_FILE" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=OptoBot-$TAG-release.apk" \
            > /tmp/asset.json
          ASSET_URL=$(python3 -c "import json; print(json.load(open('/tmp/asset.json')).get('browser_download_url',''))")
          echo "APK uploaded to: $ASSET_URL"
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @OptoBot-checksums.txt \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=OptoBot-checksums.txt" \
            > /dev/null
          echo "Done"

  notify:
    name: Summary
    needs: build-apk
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "### OptoBot APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.build-apk.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**APK download:** [Releases page](https://github.com/stromplayz/optobot/releases)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK is automatically published to the Releases page on every successful build." >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "adb install OptoBot-*-release.apk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
