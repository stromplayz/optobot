name: Build OptoBot APK

# Builds a release APK for OptoBot on every push to main and on manual dispatch.
#
# What this workflow does NOT do:
#   - It does NOT download any model from HuggingFace, Ollama Hub, or any
#     other model hub. The user must drop their own model.onnx + tokenizer.json
#     into _model_raw/ (gitignored) BEFORE the workflow runs. We encrypt and
#     bundle whatever they provide.
#   - If _model_raw/ is empty, the workflow builds a "stub" APK with a mock
#     engine so the UI can be previewed. The app still installs and shows
#     the chat UI; the model just won't generate real responses.
#
# Secrets you can optionally configure:
#   - SIGN_KEYSTORE_BASE64     (optional — base64 of your release .jks for signing)
#   - SIGN_KEY_ALIAS           (optional)
#   - SIGN_STORE_PASSWORD      (optional)
#   - SIGN_KEY_PASSWORD        (optional)
#
# Threat model note:
#   - We NEVER hardcode any model name, vendor string, or the per-build secret
#     in this file. The build secret is generated fresh on every run via
#     scripts/gen_key.py and lives only inside the runner's build sandbox.
#   - OptoBuildSecret.kt is generated at workflow run-time, used for the
#     build, and discarded. It is never committed to git.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      stub_mode:
        description: 'Force a stub build (no model needed) for UI preview'
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build deps (cryptography for AES-256-GCM)
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate per-build OptoBuildSecret + salt
        run: |
          python3 scripts/gen_key.py --force
          test -f android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          grep -q "OptoBuildSecret" android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          echo "OptoBuildSecret.kt generated locally (not committed)"

      - name: Build & encrypt bundled model (or stub if no model is provided)
        env:
          FORCE_STUB: ${{ inputs.stub_mode }}
        run: |
          if [ "$FORCE_STUB" = "true" ]; then
            echo "Stub mode forced via workflow_dispatch input"
            rm -f _model_raw/model.onnx _model_raw/tokenizer.json
          fi
          bash scripts/build_assets.sh
          ls -lh android/app/src/main/assets/opto_*.bin android/app/src/main/assets/opto_key.hint

      - name: Configure Gradle
        working-directory: android
        run: |
          SDK_DIR="$ANDROID_HOME"
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            echo "NDK not found in \$ANDROID_HOME/ndk — using SDK default"
            echo "sdk.dir=$SDK_DIR" > local.properties
          else
            echo "sdk.dir=$SDK_DIR" > local.properties
            echo "ndk.dir=$NDK_DIR" >> local.properties
          fi
          cat local.properties

      - name: Decode release keystore (if provided)
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        working-directory: android/app
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "release.keystore decoded"

      - name: Build release APK
        working-directory: android
        env:
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Locate built APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Found APK: $APK"
          BASENAME=$(basename "$APK")
          cp "$APK" "OptoBot-${GITHUB_SHA::7}-${BASENAME}"

      - name: Compute APK checksum
        run: |
          sha256sum OptoBot-*.apk | tee OptoBot-checksums.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptoBot-APK-${{ github.sha }}
          path: |
            OptoBot-*.apk
            OptoBot-checksums.txt
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup sensitive files (defensive — runner is destroyed post-job)
        if: always()
        run: |
          rm -f android/app/src/main/java/com/optobot/native/OptoBuildSecret.kt
          rm -f android/app/src/main/assets/opto_*.bin
          rm -f android/app/src/main/assets/opto_key.hint
          rm -f android/app/release.keystore
          echo "cleaned sensitive intermediates"

  notify:
    name: Summary
    needs: build-apk
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "### OptoBot APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.build-apk.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the workflow run page (Artifacts section, retained 30 days)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To build with a real model:** drop your \`model.onnx\` + \`tokenizer.json\` into \`_model_raw/\` and push to main." >> $GITHUB_STEP_SUMMARY
          echo "**For UI preview only:** trigger this workflow with the 'stub_mode' input checked." >> $GITHUB_STEP_SUMMARY
