// Root build.gradle — minimal, no React Native
buildscript {
    ext {
        kotlinVersion = "2.4.20"
        gradlePluginVersion = "8.5.0"
        minSdkVersion = 26
        compileSdkVersion = 34
        targetSdkVersion = 34
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:${gradlePluginVersion}")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        // Compose compiler plugin (Kotlin 2.0+ has it built-in; for 1.9.x we use the kotlin plugin)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        mavenLocal()
    }
}
