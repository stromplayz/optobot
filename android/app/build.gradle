// App build.gradle — native Kotlin + Jetpack Compose (no React Native)
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.optobot"
    compileSdkVersion rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        // Kotlin 1.9.24 → Compose compiler 1.5.14
        kotlinCompilerExtensionVersion '1.5.14'
    }

    defaultConfig {
        applicationId "com.optobot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.4.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            // Use debug signing for now so the APK is installable without
            // a custom keystore. Swap for a real release config when ready
            // to publish to Play Store.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += [
                "META-INF/*.kotlin_module",
                "META-INF/INDEX.LIST",
                "META-INF/io.netty.versions.properties",
            ]
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Jetpack Compose — UI framework
    def composeBom = platform('androidx.compose:compose-bom:2024.09.02')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // ONNX Runtime Android — for real on-device LLM inference
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'

    // JSON parsing (for OptoReach API responses)
    implementation 'org.json:json:20240303'

    // Test
    testImplementation 'junit:junit:4.13.2'
}

// Make sure OptoBuildSecret.kt exists for release builds.
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.preBuild.doFirst {
            def f = file("src/main/java/com/optobot/native/OptoBuildSecret.kt")
            if (!f.exists()) {
                throw new GradleException("OptoBuildSecret.kt missing — run scripts/gen_key.py")
            }
        }
    }
}
