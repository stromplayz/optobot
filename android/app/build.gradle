// App build.gradle — minimal, no RN gradle plugin (avoids CLI dependency)
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

/**
 * OptoBuildSecret.kt is gitignored — generated by scripts/gen_key.py.
 * The release build fails fast if it is missing.
 */
android {
    namespace "com.optobot"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.optobot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // release { /* provide your own keystore */ }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources {
            excludes += [
                "META-INF/*.kotlin_module",
                "META-INF/INDEX.LIST",
                "META-INF/io.netty.versions.properties",
            ]
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // React Native (uses the maven repo declared in root build.gradle)
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.ext.kotlinVersion}"

    // ONNX Runtime Android — prebuilt from Microsoft
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.0"

    // Test
    testImplementation "junit:junit:4.13.2"
}

// Make sure OptoBuildSecret.kt exists for release builds.
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.preBuild.doFirst {
            def f = file("src/main/java/com/optobot/native/OptoBuildSecret.kt")
            if (!f.exists()) {
                throw new GradleException("OptoBuildSecret.kt missing — run scripts/gen_key.py")
            }
        }
    }
}
